[project]
name = "house-of-desserts"
version = "0.2.0"
description = "Order management system for a home bakery"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "python-escpos>=3.1",
    "fpdf2>=2.7",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "ruff>=0.4",
    "playwright>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "B008",
    "UP042",
    "N806",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"tests/conftest.py" = ["E402", "N806"]
"tests/**/*.py" = ["E741", "B007", "E712", "F401"]
"app/services/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/ui -q"
markers = [
    "ui: Playwright UI tests (require running app + browser)",
]

[tool.setuptools.packages.find]
include = ["app*"]