<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/images/logo.png" />
    <link href="/static/css/app.css" rel="stylesheet" type="text/css" />
    <script src="/static/js/htmx.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200">

    <!-- Top Navbar -->
    <div class="navbar bg-gradient-to-r from-amber-50 to-orange-50 shadow-md sticky top-0 z-50 border-b border-amber-200">
        <div class="container mx-auto px-4 flex items-center">
            <a href="/today" class="flex items-center gap-2 mr-2">
                <img src="/static/images/logo.png" alt="Logo"
                     class="h-9 w-9 rounded-full shadow-sm object-cover" />
                <div class="hidden sm:block">
                    <span class="text-lg font-extrabold bg-gradient-to-r from-amber-700 to-orange-600
                                 bg-clip-text text-transparent leading-tight block">
                        {{ settings.app_name }}
                    </span>
                    <span class="text-[10px] text-amber-600 font-medium tracking-wide hidden md:block">
                        {{ settings.app_tagline }}
                    </span>
                </div>
            </a>

            <nav class="flex items-center justify-center gap-0.5 flex-1 overflow-x-auto py-1">
                <a href="/today"
                   class="btn btn-sm btn-ghost font-semibold whitespace-nowrap {% if '/today' in request.url.path %}btn-active bg-amber-100 text-amber-900{% endif %}">
                    📅 <span class="hidden sm:inline">Today</span>
                </a>
                <a href="/dashboard"
                   class="btn btn-sm btn-ghost font-semibold whitespace-nowrap {% if '/dashboard' in request.url.path %}btn-active bg-amber-100 text-amber-900{% endif %}">
                    📊 <span class="hidden sm:inline">Dashboard</span>
                </a>
                <a href="/products"
                   class="btn btn-sm btn-ghost font-semibold whitespace-nowrap {% if '/products' in request.url.path %}btn-active bg-amber-100 text-amber-900{% endif %}">
                    🎂 <span class="hidden sm:inline">Products</span>
                </a>
                <a href="/customers"
                   class="btn btn-sm btn-ghost font-semibold whitespace-nowrap {% if '/customers' in request.url.path %}btn-active bg-amber-100 text-amber-900{% endif %}">
                    👥 <span class="hidden sm:inline">Customers</span>
                </a>
                <a href="/orders"
                   class="btn btn-sm btn-ghost font-semibold whitespace-nowrap {% if '/orders' in request.url.path %}btn-active bg-amber-100 text-amber-900{% endif %}">
                    📋 <span class="hidden sm:inline">Orders</span>
                </a>
                <a href="/export"
                   class="btn btn-sm btn-ghost font-semibold whitespace-nowrap {% if '/export' in request.url.path %}btn-active bg-amber-100 text-amber-900{% endif %}">
                    📥 <span class="hidden sm:inline">Export</span>
                </a>
                <a href="/reports"
                   class="btn btn-sm btn-ghost font-semibold whitespace-nowrap {% if '/reports' in request.url.path %}btn-active bg-amber-100 text-amber-900{% endif %}">
                    📊 <span class="hidden sm:inline">Reports</span>
                </a>
                <!-- <a href="/audit"
                   class="btn btn-sm btn-ghost font-semibold whitespace-nowrap {% if '/audit' in request.url.path %}btn-active bg-amber-100 text-amber-900{% endif %}">
                    📜 <span class="hidden sm:inline">Audit</span>
                </a> -->
            </nav>

            <div class="flex-none flex items-center gap-2">
                <div class="flex flex-col items-end leading-tight hidden md:flex">
                    <span id="nav-date" class="text-xs font-semibold text-amber-800"></span>
                    <span id="nav-time" class="text-xs text-amber-600 font-mono"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="p-4 md:p-6 max-w-7xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile FAB -->
    <a href="/orders/new"
       class="btn btn-circle btn-primary fixed bottom-6 right-6 z-50 shadow-lg md:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
    </a>

    <!-- Toast root -->
    <div id="toast-root" class="toast toast-end toast-bottom z-[100]"></div>

    <!-- Live clock + shared helpers -->
    <script>
    function updateClock() {
        const now = new Date();
        const d = document.getElementById('nav-date');
        const t = document.getElementById('nav-time');
        if (d) d.textContent = now.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        if (t) t.textContent = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    function toast(msg, kind = 'info') {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const el = document.createElement('div');
        const cls = kind === 'error' ? 'alert-error'
                  : kind === 'success' ? 'alert-success'
                  : 'alert-info';
        el.className = `alert ${cls} shadow-lg`;
        el.innerHTML = `<span>${msg}</span>`;
        root.appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }
    // Global HTMX error handling — surface server errors as toasts.
    document.body.addEventListener('htmx:responseError', function (evt) {
        let msg = 'Request failed';
        try {
            const detail = JSON.parse(evt.detail.xhr.responseText).detail;
            if (detail) msg = detail;
        } catch (e) { /* not JSON, use default */ }
        if (typeof toast === 'function') toast(msg, 'error');
    });
    document.body.addEventListener('htmx:sendError', function () {
        if (typeof toast === 'function') toast('Network error', 'error');
    });
    </script>

    {% block modals %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
