{% extends "base.html" %}
{% block title %}Export — {{ settings.app_name }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-4">

    <h1 class="text-2xl font-extrabold text-amber-900">Data Export</h1>
    <p class="text-base-content/60 text-sm">Download orders, payments, or a summary for tax filing.</p>

    <div class="card bg-base-100 shadow-sm">
        <div class="card-body space-y-4">

            <div class="grid grid-cols-2 gap-4">
                <div class="form-control">
                    <label class="label"><span class="label-text font-semibold">From Date</span></label>
                    <input type="date" id="export-start" class="input input-bordered w-full"
                           value="{{ today_start }}" />
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text font-semibold">To Date</span></label>
                    <input type="date" id="export-end" class="input input-bordered w-full"
                           value="{{ today_end }}" />
                </div>
            </div>

            <div class="divider">Download</div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <a id="dl-orders" href="#" class="btn btn-outline btn-amber btn-sm gap-2 font-semibold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    Orders CSV
                </a>
                <a id="dl-payments" href="#" class="btn btn-outline btn-amber btn-sm gap-2 font-semibold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    Payments CSV
                </a>
                <a id="dl-summary" href="#" class="btn btn-outline btn-amber btn-sm gap-2 font-semibold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    Summary JSON
                </a>
            </div>

        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function updateLinks() {
    const start = document.getElementById('export-start').value;
    const end = document.getElementById('export-end').value;
    const params = `start=${start}&end=${end}`;
    document.getElementById('dl-orders').href = `/export/orders.csv?${params}`;
    document.getElementById('dl-payments').href = `/export/payments.csv?${params}`;
    document.getElementById('dl-summary').href = `/export/summary.json?${params}`;
}
document.getElementById('export-start').addEventListener('change', updateLinks);
document.getElementById('export-end').addEventListener('change', updateLinks);
updateLinks();
</script>
{% endblock %}
